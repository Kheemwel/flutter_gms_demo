name: flutter_gms_demo
description: "Flutter port of FLAGMS"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0

  # State management
  flutter_hooks: ^0.21.4
  riverpod_annotation: ^4.0.8
  hooks_riverpod: ^3.5.0

  # Codegen models
  freezed_annotation: ^3.1.0

  # Routing
  go_router: ^18.1.4

  # Utils
  intl: ^0.20.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Codegen
  riverpod_generator: ^4.0.10
  build_runner: ^2.17.1
  freezed: ^4.0.3
  go_router_builder: ^4.5.3

flutter:
  uses-material-design: true
